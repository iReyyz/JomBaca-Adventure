<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - JomBaca Adventure</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div style="padding: 20px; max-width: 800px; margin: 0 auto;">
        <h1>Selamat Datang, {{ user.username }}! 🌟</h1>
        <div style="background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px;">
            <p><strong>Tahap (Level):</strong> {{ user.level }}</p>
            <p><strong>Mata XP:</strong> {{ user.xp }}</p>
            <p><strong>Syiling (Coins):</strong> 🪙 {{ user.coins }}</p>
        </div>
        <a href="{{ url_for('game.play_game') }}" class="btn-primary" style="display: inline-block; width: auto; text-decoration: none;">Main Game 🎮</a>
        <a href="{{ url_for('auth.logout') }}" style="margin-left: 15px; color: red;">Log Keluar</a>
    </div>
</body>
</html>
