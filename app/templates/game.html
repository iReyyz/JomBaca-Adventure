<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game - JomBaca Adventure 🎯</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .game-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 550px;
            margin: 30px auto;
            text-align: center;
        }
        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .diff-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #ccc;
            background: #f5f5f5;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .diff-btn.active[data-diff="easy"] { background: #C8E6C9; border-color: #388E3C; color: #1B5E20; }
        .diff-btn.active[data-diff="medium"] { background: #FFE0B2; border-color: #F57C00; color: #E65100; }
        .diff-btn.active[data-diff="hard"] { background: #FFCDD2; border-color: #D32F2F; color: #B71C1C; }
        
        .question-box {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            background: #FFF3E0;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            border: 3px dashed var(--primary-light);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .option-btn {
            background: #E8F5E9;
            border: 2px solid var(--secondary);
            color: #2E7D32;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: var(--secondary);
            color: white;
            transform: scale(1.03);
        }
        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            background: #F5F5F5;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="game-card">
        <h2>Mini Game: Kenal Huruf & Perkataan 🎯</h2>
        
        <div class="difficulty-selector">
            <button class="diff-btn active" data-diff="easy" onclick="setDifficulty('easy')">🌱 Mudah</button>
            <button class="diff-btn" data-diff="medium" onclick="setDifficulty('medium')">⭐ Biasa</button>
            <button class="diff-btn" data-diff="hard" onclick="setDifficulty('hard')">🔥 Susah</button>
        </div>

        <div class="score-board">
            <span>⭐ Skor: <span id="current-score">0</span></span>
            <span>✨ XP: <span id="user-xp">{{ user.xp }}</span></span>
            <span>🪙 Coin: <span id="user-coins">{{ user.coins }}</span></span>
        </div>

        <p id="instruction" style="font-size: 1.2rem; font-weight: bold;">Pilih jawapan yang betul!</p>

        <div class="question-box" id="question">...</div>

        <div class="options-grid" id="options"></div>

        <div id="feedback" style="margin-top: 20px; font-size: 1.3rem; font-weight: bold; height: 30px;"></div>

        <div style="margin-top: 30px;">
            <a href="{{ url_for('game.dashboard') }}" style="color: #666; text-decoration: none; font-weight: bold;">⬅ Kembali ke Dashboard</a>
        </div>
    </div>

    <script>
        // Bank Soalan Rawak & Pelbagai Tanpa Petunjuk Dalam Kurungan
        const rawBankSoalan = {
            easy: [
                { prompt: "Apakah huruf vokal pertama?", display: "___", choices: ["A", "B", "M", "K"], answer: "A" },
                { prompt: "Lengkapkan ejaan perkataan BATU:", display: "B _ T U", choices: ["E", "A", "I", "O"], answer: "A" },
                { prompt: "Huruf apakah yang bermula untuk AYAM?", display: "🐓 AYAM", choices: ["A", "C", "D", "B"], answer: "A" },
                { prompt: "Lengkapkan ejaan perkataan IBU:", display: "I B _", choices: ["A", "U", "I", "E"], answer: "U" },
                { prompt: "Huruf vokal untuk ULAR:", display: "🐍 ULAR", choices: ["O", "I", "U", "E"], answer: "U" },
                { prompt: "Pilih huruf besar untuk 'm':", display: "m", choices: ["M", "N", "W", "V"], answer: "M" },
                { prompt: "Lengkapkan ejaan BOLA:", display: "B _ L A", choices: ["O", "A", "I", "U"], answer: "O" },
                { prompt: "Manakah huruf 'Z'?", display: "___", choices: ["Z", "N", "X", "Y"], answer: "Z" },
                { prompt: "Lengkapkan ejaan TOP I:", display: "T O P _", choices: ["I", "E", "O", "U"], answer: "I" },
                { prompt: "Apakah huruf akhir untuk RAMBUT?", display: "R A M B U _", choices: ["T", "P", "K", "M"], answer: "T" }
            ],
            medium: [
                { prompt: "Ejaan yang betul untuk haiwan ini:", display: "🐱", choices: ["Kucing", "Kambing", "Kuda", "Kera"], answer: "Kucing" },
                { prompt: "Lengkapkan suku kata BUKU:", display: "BU - ___", choices: ["KU", "SU", "LU", "TU"], answer: "KU" },
                { prompt: "Lengkapkan suku kata RAJA:", display: "RA - ___", choices: ["JA", "MA", "CA", "PA"], answer: "JA" },
                { prompt: "Pilih perkataan yang betul:", display: "🏫", choices: ["Rumah", "Sekolah", "Taman", "Kedai"], answer: "Sekolah" },
                { prompt: "Lengkapkan perkataan BOLA:", display: "BO - ___", choices: ["LA", "TA", "MA", "SA"], answer: "LA" },
                { prompt: "Pilih ejaan warna merah:", display: "🔴", choices: ["Merah", "Kuning", "Hijau", "Biru"], answer: "Merah" },
                { prompt: "Apakah nama buah ini?", display: "🍎", choices: ["Epal", "Pisang", "Tembikai", "Nanas"], answer: "Epal" },
                { prompt: "Lengkapkan suku kata RO-TI:", display: "RO - ___", choices: ["TI", "PI", "LI", "KI"], answer: "TI" },
                { prompt: "Pilih ejaan yang betul untuk baju:", display: "👕", choices: ["Baju", "Batu", "Bulu", "Bubu"], answer: "Baju" },
                { prompt: "Suku kata untuk PISANG:", display: "PI - ___", choices: ["SANG", "MANG", "BANG", "LANG"], answer: "SANG" }
            ],
            hard: [
                { prompt: "Susun suku kata menjadi perkataan:", display: "KAP - TUL", choices: ["Tulkap", "Laptul", "Kaptul", "Tukal"], answer: "Kaptul" },
                { prompt: "Apakah binaan ayat yang betul?", display: "Saya ___ nasi.", choices: ["minum", "makan", "tidur", "lari"], answer: "makan" },
                { prompt: "Cari ejaan yang betul:", display: "🌺 Bunga Kebangsaan", choices: ["Bunga Raya", "Bunga Mawar", "Bunga Orkid", "Bunga Melur"], answer: "Bunga Raya" },
                { prompt: "Lengkapkan frasa:", display: "Kereta ini sangat ___.", choices: ["laju", "tinggi", "manis", "wangi"], answer: "laju" },
                { prompt: "Pilih kata nama haiwan udara:", choices: ["Ikan", "Burung", "Kucing", "Ular"], answer: "Burung" },
                { prompt: "Mana perkataan berlawanan bagi TINGGI?", display: "Tinggi ⬆️", choices: ["Rendah", "Panjang", "Besar", "Kecil"], answer: "Rendah" },
                { prompt: "Lengkapkan peribahasa:", display: "Bagaikan ___ dengan tebing.", choices: ["aur", "air", "api", "batu"], answer: "aur" },
                { prompt: "Apakah lawan bagi PANAS?", display: "🔥 Panas", choices: ["Sejuk", "Manis", "Terang", "Gelap"], answer: "Sejuk" },
                { prompt: "Pilih kata kerja yang sesuai:", display: "Adik ___ air tembikai.", choices: ["minum", "makan", "baca", "lompat"], answer: "minum" },
                { prompt: "Susun semula kata: HARI - SE - KO - LAH", display: "🏫", choices: ["Hari Sekolah", "Sekolah Hari", "Lahse Hari", "Hari Lahse"], answer: "Hari Sekolah" }
            ]
        };

        let currentDiff = 'easy';
        let currentIdx = 0;
        let sessionScore = 0;
        let activeQuestions = [];

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function setDifficulty(diff) {
            currentDiff = diff;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.diff === diff);
            });
            currentIdx = 0;
            sessionScore = 0;
            document.getElementById('current-score').innerText = sessionScore;

            // Ambil soalan secara rawak setiap kali tahap dipilih
            activeQuestions = shuffle([...rawBankSoalan[diff]]).slice(0, 5);
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIdx >= activeQuestions.length) {
                document.getElementById('question').innerText = "🎉 TAHNIAH!";
                document.getElementById('instruction').innerText = `Tamat Tahap ${currentDiff.toUpperCase()}! Skor: ${sessionScore}`;
                document.getElementById('options').innerHTML = `<button class="option-btn" onclick="saveAndRestart()" style="grid-column: span 2; background: var(--primary); color: white;">Simpan Skor & Main Lagi 💾</button>`;
                document.getElementById('feedback').innerText = "";
                saveScoreToBackend(sessionScore);
                return;
            }

            const q = activeQuestions[currentIdx];
            document.getElementById('instruction').innerText = q.prompt;
            document.getElementById('question').innerText = q.display;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            // Rawakkan pilihan jawapan
            const shuffledChoices = shuffle([...q.choices]);
            
            shuffledChoices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(choice, q.answer);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedChoice, correctChoice) {
            const feedback = document.getElementById('feedback');
            if (selectedChoice === correctChoice) {
                const pts = currentDiff === 'easy' ? 10 : (currentDiff === 'medium' ? 15 : 20);
                sessionScore += pts;
                document.getElementById('current-score').innerText = sessionScore;
                feedback.style.color = "#2E7D32";
                feedback.innerText = "Syabas! Jawapan Betul! 🥳";
            } else {
                feedback.style.color = "#C62828";
                feedback.innerText = "Alamak! Cuba lagi ya! 😅";
            }

            setTimeout(() => {
                feedback.innerText = "";
                currentIdx++;
                loadQuestion();
            }, 1000);
        }

        function saveScoreToBackend(pts) {
            fetch('/save-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ score: pts })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    document.getElementById('user-xp').innerText = data.new_xp;
                    document.getElementById('user-coins').innerText = data.new_coins;
                }
            })
            .catch(err => console.error("Error saving score:", err));
        }

        function saveAndRestart() {
            setDifficulty(currentDiff);
        }

        setDifficulty('easy');
    </script>
</body>
</html>
