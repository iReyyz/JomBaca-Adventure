<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game - JomBaca Adventure 🎯</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .game-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
        }

        .selector-box {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .mode-btn,
        .diff-btn {
            padding: 10px 18px;
            border-radius: 20px;
            border: 2px solid #ccc;
            background: #f5f5f5;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .mode-btn.active {
            background: #E1F5FE;
            border-color: #0288D1;
            color: #01579B;
        }

        .diff-btn.active[data-diff="mudah"] {
            background: #C8E6C9;
            border-color: #388E3C;
            color: #1B5E20;
        }

        .diff-btn.active[data-diff="normal"] {
            background: #FFE0B2;
            border-color: #F57C00;
            color: #E65100;
        }

        .diff-btn.active[data-diff="susah"] {
            background: #FFCDD2;
            border-color: #D32F2F;
            color: #B71C1C;
        }

        .question-box {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--primary);
            background: #FFF3E0;
            padding: 20px;
            border-radius: 15px;
            margin: 15px 0;
            border: 3px dashed var(--primary-light);
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .option-btn {
            background: #E8F5E9;
            border: 2px solid var(--secondary);
            color: #2E7D32;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: var(--secondary);
            color: white;
            transform: scale(1.03);
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 1rem;
            font-weight: bold;
            background: #F5F5F5;
            padding: 10px;
            border-radius: 10px;
        }

        .suku-biru {
            color: #1976D2;
        }

        .suku-merah {
            color: #D32F2F;
        }

        .clue-img {
            font-size: 4rem;
            line-height: 1;
        }

        .reward-box {
            margin: 15px 0 20px;
            padding: 15px;
            border-radius: 15px;
            background: #FFF8E1;
            border: 2px solid #FFD54F;
        }

        .reward-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #6D4C41;
        }

        .reward-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .reward-btn {
            border: 2px solid #FFB300;
            background: #FFF3CD;
            color: #6D4C41;
            border-radius: 12px;
            padding: 10px 6px;
            font-weight: bold;
            cursor: pointer;
            min-height: 70px;
        }

        .reward-btn:hover {
            transform: scale(1.03);
            background: #FFE082;
        }

        #reward-feedback {
            margin-top: 10px;
            min-height: 22px;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .reward-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="game-card">
        <h2>Mini Game: JomBaca & Mengira 🎯</h2>

        <!-- Pilihan Mod Game -->
        <div style="margin-bottom: 5px; font-weight: bold; color: #555;">1. Pilih Mod Permainan:</div>
        <div class="selector-box">
            <button class="mode-btn active" id="btn-m-mengeja" onclick="selectMode('mengeja')">🔤 Mengeja</button>
            <button class="mode-btn" id="btn-m-mengira" onclick="selectMode('mengira')">🔢 Mengira</button>
        </div>

        <!-- Pilihan Tahap Kesukaran -->
        <div style="margin-bottom: 5px; font-weight: bold; color: #555;">2. Pilih Tahap Kesukaran:</div>
        <div class="selector-box">
            <button class="diff-btn active" data-diff="mudah" onclick="selectDiff('mudah')">🌱 Mudah (10 Mata)</button>
            <button class="diff-btn" data-diff="normal" onclick="selectDiff('normal')">⭐ Normal (20 Mata)</button>
            <button class="diff-btn" data-diff="susah" onclick="selectDiff('susah')">🔥 Susah (35 Mata)</button>
        </div>

        <div class="score-board">
            <span>⭐ Skor: <span id="current-score">0</span></span>
            <span>✨ XP: <span id="user-xp">{{ user.xp }}</span></span>
            <span>🪙 Coin: <span id="user-coins">{{ user.coins }}</span></span>
        </div>

        <div class="reward-box">
            <div class="reward-title">🎁 Tukar Coin kepada Reward</div>
            <div class="reward-grid">
                <button class="reward-btn" onclick="redeemReward('profile_frame', 50)">
                    🖼️ Bingkai Profil<br><small>50 🪙</small>
                </button>
                <button class="reward-btn" onclick="redeemReward('xp_bonus', 100)">
                    ✨ +50 XP<br><small>100 🪙</small>
                </button>
                <button class="reward-btn" onclick="redeemReward('badge', 150)">
                    🏅 Lencana<br><small>150 🪙</small>
                </button>
            </div>
            <div id="reward-feedback"></div>
        </div>

        <button onclick="startGameSession()" class="btn-primary"
            style="margin-bottom: 15px; width: 100%; background: #4CAF50;">Mula Pusingan Baru 🚀</button>

        <p id="instruction" style="font-size: 1.2rem; font-weight: bold; min-height: 30px;">Pilih mod & tahap di atas,
            kemudian tekan Mula!</p>

        <div class="question-box" id="question">...</div>

        <div class="options-grid" id="options"></div>

        <div id="feedback" style="margin-top: 20px; font-size: 1.3rem; font-weight: bold; height: 30px;"></div>

        <div style="margin-top: 25px;">
            <a href="{{ url_for('game.dashboard') }}" style="color: #666; text-decoration: none; font-weight: bold;">⬅
                Kembali ke Dashboard</a>
        </div>
    </div>

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function coloredWord(word) {
            const mid = Math.ceil(word.length / 2);
            return `<span class="suku-biru">${escapeHtml(word.slice(0, mid).toUpperCase())}</span><span class="suku-merah">${escapeHtml(word.slice(mid).toUpperCase())}</span>`;
        }

        function makeLetterChoices(correct) {
            const letters = "AEIOUBCDGHLKMNPRST";
            const choices = [correct.toUpperCase()];
            let guard = 0;
            while (choices.length < 4 && guard < 100) {
                const c = letters[Math.floor(Math.random() * letters.length)];
                if (!choices.includes(c)) choices.push(c);
                guard++;
            }
            return shuffle(choices);
        }

        function makePictureChoices(word) {
            const correct = emojiMap[word] || "📝";
            const pool = [

                "☀️", "🌙", "⭐", "🌈", "🔴", "🔵", "🟢", "🟡", "🟣", "🟠"
            ];
            const choices = [correct];
            const shuffled = shuffle([...pool]);
            for (const item of shuffled) {
                if (!choices.includes(item)) choices.push(item);
                if (choices.length === 4) break;
            }
            return shuffle(choices);
        }

            const words = spellingWords[diff];
            return words.map((word, index) => {
                const id = `e_${diff[0]}_${index + 1}`;
                const mode = index % 3;

                // MUDAH & NORMAL: warna biru/merah dan variasi isi huruf / pilih gambar.
                if (diff !== 'susah') {
                    if (mode === 1 && emojiMap[word]) {
                        return {
                            id,
                            prompt: "Pilih gambar yang sepadan dengan ejaan:",
                            display_html: coloredWord(word),
                            choices: makePictureChoices(word),
                            answer: emojiMap[word]
                        };
                    }

                    const missingIndex = (index * 7 + word.length) % word.length;
                    const answer = word[missingIndex].toUpperCase();
                    const masked = word
                        .split('')
                        .map((ch, i) => i === missingIndex ? '_' : ch.toUpperCase())
                        .join('');

                    const mid = Math.ceil(word.length / 2);
                    let display = "";
                    masked.split('').forEach((ch, i) => {
                        const cls = i < mid ? "suku-biru" : "suku-merah";
                        display += `<span class="${cls}">${ch}</span>`;
                    });

                    return {
                        id,
                        prompt: "Lengkapkan huruf yang hilang:",
                        display_html: display,
                        choices: makeLetterChoices(answer),
                        answer
                    };
                }

                // SUSAH: tiada warna dan menggunakan perkataan yang lebih mencabar.
                const correct = word.charAt(0).toUpperCase() + word.slice(1);
                const wrongs = [
                    correct.slice(0, -1) + (correct.endsWith('a') ? 'e' : 'a'),
                    correct.replace(/[aeiou]/i, 'e'),
                    correct.replace(/k/g, 'c').replace(/K/g, 'C')
                ];
                const choices = [correct];
                wrongs.forEach(w => {
                    if (w !== correct && !choices.includes(w)) choices.push(w);
                });
                const extra = [
                    correct.slice(0, Math.max(1, correct.length - 2)),
                    correct + "s",
                    correct.replace(/a/gi, "o")
                ];
                for (const w of extra) {
                    if (w && !choices.includes(w)) choices.push(w);
                    if (choices.length === 4) break;
                }

                return {
                    id,
                    prompt: "Pilih ejaan yang betul:",
                    display_html: `<span>${escapeHtml(correct.toUpperCase())}</span>`,
                    choices: shuffle(choices.slice(0, 4)),
                    answer: correct
                };
            });
        }

        // GENERATOR SOALAN MENGIRA (150 soalan bagi setiap tahap)
        function generateMathQuestions(diff) {
            let list = [];
            const opsNormal = ['+', '-', '*', '/'];
            const opsHard = ['+', '-', '*', '/'];

            for (let i = 1; i <= 150; i++) {
                let a, b, op, ans;

                if (diff === 'mudah') {
                    op = i % 2 === 0 ? '+' : '-';
                    a = ((i * 3) % 10) + 1;
                    b = ((i * 7) % 10) + 1;
                    if (op === '-' && a < b) [a, b] = [b, a];
                    ans = op === '+' ? a + b : a - b;
                } else if (diff === 'normal') {
                    op = opsNormal[(i - 1) % opsNormal.length];
                    if (op === '+') {
                        a = ((i * 3) % 10) + 1;
                        b = ((i * 5) % 10) + 1;
                        ans = a + b;
                    } else if (op === '-') {
                        a = ((i * 7) % 10) + 1;
                        b = ((i * 4) % 10) + 1;
                        if (a < b) [a, b] = [b, a];
                        ans = a - b;
                    } else if (op === '*') {
                        a = ((i * 2) % 10) + 1;
                        b = ((i * 3) % 10) + 1;
                        ans = a * b;
                    } else {
                        b = ((i * 3) % 10) + 1;
                        ans = ((i * 5) % 10) + 1;
                        a = ans * b;
                    }
                } else {
                    op = opsHard[(i - 1) % opsHard.length];
                    if (op === '+') {
                        a = ((i * 17) % 100) + 1;
                        b = ((i * 29) % 100) + 1;
                        ans = a + b;
                    } else if (op === '-') {
                        a = ((i * 37) % 100) + 1;
                        b = ((i * 19) % 100) + 1;
                        if (a < b) [a, b] = [b, a];
                        ans = a - b;
                    } else if (op === '*') {
                        a = ((i * 11) % 100) + 1;
                        b = ((i * 7) % 100) + 1;
                        ans = a * b;
                    } else {
                        b = ((i * 13) % 100) + 1;
                        ans = ((i * 17) % 100) + 1;
                        a = ans * b;
                    }
                }

                const wrongs = [
                    ans + (diff === 'mudah' ? 1 : diff === 'normal' ? 2 : 5),
                    Math.max(0, ans - (diff === 'mudah' ? 1 : 2)),
                    ans + (diff === 'mudah' ? 2 : diff === 'normal' ? 3 : 10)
                ];

                list.push({
                    id: `m_${diff[0]}_${i}_${a}${op}${b}`,
                    prompt: diff === 'mudah'
                        ? "Selesaikan operasi tambah atau tolak:"
                        : diff === 'normal'
                            ? "Selesaikan operasi matematik:"
                            : "Selesaikan soalan matematik cabaran:",
                    display_html: `${a} ${op === '*' ? '×' : (op === '/' ? '÷' : op)} ${b} = ?`,
                    choices: shuffle([ans.toString(), ...wrongs.map(x => x.toString())]),
                    answer: ans.toString()
                });
            }
            return list;
        }

        let currentMode = 'mengeja';
        let currentDiff = 'mudah';
        let currentIdx = 0;
        let sessionScore = 0;
        let activeQuestions = [];
        let seenQuestionIds = [];

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function selectMode(m) {
            currentMode = m;
            document.getElementById('btn-m-mengeja').classList.toggle('active', m === 'mengeja');
            document.getElementById('btn-m-mengira').classList.toggle('active', m === 'mengira');
        }

        function selectDiff(d) {
            currentDiff = d;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.diff === d);
            });
        }

        // Ambil senarai ID soalan yang pernah dijawab dlm masa 7 hari daripada backend
        function fetchSeenQuestionsAndStart() {
            fetch('/get-seen-questions')
                .then(res => res.json())
                .then(data => {
                    seenQuestionIds = data.seen_ids || [];
                    prepareQuestions();
                })
                .catch(err => {
                    console.error("Ralat ambil soalan 7 hari:", err);
                    prepareQuestions();
                });
        }

        function prepareQuestions() {
            let pool = [];
            if (currentMode === 'mengeja') {
                pool = [...bankMengeja[currentDiff]];
            } else {
                pool = generateMathQuestions(currentDiff);
            }

            // Tapis soalan supaya elak soalan yang dijawab dlm masa 7 hari
            let freshPool = pool.filter(q => !seenQuestionIds.includes(q.id));
            if (freshPool.length < 5) {
                freshPool = pool; // Jika soalan terhad, guna balik pusingan pool
            }

            activeQuestions = shuffle(freshPool).slice(0, 5);
            currentIdx = 0;
            sessionScore = 0;
            document.getElementById('current-score').innerText = sessionScore;
            loadQuestion();
        }

        function startGameSession() {
            fetchSeenQuestionsAndStart();
        }

        function loadQuestion() {
            if (currentIdx >= activeQuestions.length) {
                document.getElementById('question').innerText = "🎉 TAHNIAH!";
                document.getElementById('instruction').innerText = `Tamat Pusingan ${currentMode.toUpperCase()} (${currentDiff.toUpperCase()})! Skor: ${sessionScore}`;
                document.getElementById('options').innerHTML = `<button class="option-btn" onclick="startGameSession()" style="grid-column: span 2; background: var(--primary); color: white;">Simpan Skor & Main Lagi 💾</button>`;
                document.getElementById('feedback').innerText = "";

                // Rekod soalan yang telah dijawab ke backend
                const answeredIds = activeQuestions.map(q => q.id);
                recordQuestionsToBackend(answeredIds);
                saveScoreToBackend(sessionScore);
                return;
            }

            const q = activeQuestions[currentIdx];
            document.getElementById('instruction').innerText = q.prompt;

            // Tiada clue/gambar dipaparkan di dalam soalan.
            // Jika ada emoji, ia hanya muncul sebagai pilihan jawapan.
            document.getElementById('question').innerHTML = `<div>${q.display_html}</div>`;

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';

            const shuffledChoices = shuffle([...q.choices]);
            shuffledChoices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(choice, q.answer);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedChoice, correctChoice) {
            const feedback = document.getElementById('feedback');
            // Mata berbeza mengikut tahap kesukaran
            const pts = currentDiff === 'mudah' ? 10 : (currentDiff === 'normal' ? 20 : 35);

            if (selectedChoice === correctChoice) {
                sessionScore += pts;
                document.getElementById('current-score').innerText = sessionScore;
                feedback.style.color = "#2E7D32";
                feedback.innerText = `Syabas! Jawapan Betul! (+${pts} Mata) 🥳`;
            } else {
                feedback.style.color = "#C62828";
                feedback.innerText = "Alamak! Cuba lagi ya! 😅";
            }

            setTimeout(() => {
                feedback.innerText = "";
                currentIdx++;
                loadQuestion();
            }, 1000);
        }

        function recordQuestionsToBackend(qIds) {
            fetch('/record-questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question_ids: qIds })
            }).catch(err => console.error("Ralat rekod soalan:", err));
        }

        function saveScoreToBackend(pts) {
            fetch('/save-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ score: pts })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('user-xp').innerText = data.new_xp;
                        document.getElementById('user-coins').innerText = data.new_coins;
                    }
                })
                .catch(err => console.error("Ralat simpan skor:", err));
        }


        function redeemReward(rewardId, cost) {
            const feedback = document.getElementById('reward-feedback');
            const currentCoins = parseInt(document.getElementById('user-coins').innerText || '0', 10);

            if (currentCoins < cost) {
                feedback.style.color = "#C62828";
                feedback.innerText = `Coin tidak mencukupi. Perlu ${cost} 🪙.`;
                return;
            }

            feedback.style.color = "#555";
            feedback.innerText = "Memproses penebusan...";

            fetch('/redeem-reward', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    reward_id: rewardId,
                    cost: cost
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        if (data.new_coins !== undefined) {
                            document.getElementById('user-coins').innerText = data.new_coins;
                        }
                        if (data.new_xp !== undefined) {
                            document.getElementById('user-xp').innerText = data.new_xp;
                        }
                        feedback.style.color = "#2E7D32";
                        feedback.innerText = data.message || "Reward berjaya ditebus! 🎉";
                    } else {
                        feedback.style.color = "#C62828";
                        feedback.innerText = data.message || "Penebusan gagal.";
                    }
                })
                .catch(err => {
                    console.error("Ralat tebus reward:", err);
                    feedback.style.color = "#C62828";
                    feedback.innerText = "Reward belum disambungkan ke backend.";
                });
        }

        // Mula secara automatik bila muat turun halaman
        startGameSession();
    </script>
