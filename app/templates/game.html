<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game - JomBaca Adventure 🎯</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .game-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
        }

        .selector-box {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .mode-btn,
        .diff-btn {
            padding: 10px 18px;
            border-radius: 20px;
            border: 2px solid #ccc;
            background: #f5f5f5;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .mode-btn.active {
            background: #E1F5FE;
            border-color: #0288D1;
            color: #01579B;
        }

        .diff-btn.active[data-diff="mudah"] {
            background: #C8E6C9;
            border-color: #388E3C;
            color: #1B5E20;
        }

        .diff-btn.active[data-diff="normal"] {
            background: #FFE0B2;
            border-color: #F57C00;
            color: #E65100;
        }

        .diff-btn.active[data-diff="susah"] {
            background: #FFCDD2;
            border-color: #D32F2F;
            color: #B71C1C;
        }

        .question-box {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--primary);
            background: #FFF3E0;
            padding: 20px;
            border-radius: 15px;
            margin: 15px 0;
            border: 3px dashed var(--primary-light);
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .option-btn {
            background: #E8F5E9;
            border: 2px solid var(--secondary);
            color: #2E7D32;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: var(--secondary);
            color: white;
            transform: scale(1.03);
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 1rem;
            font-weight: bold;
            background: #F5F5F5;
            padding: 10px;
            border-radius: 10px;
        }

        .suku-biru {
            color: #1976D2;
        }

        .suku-merah {
            color: #D32F2F;
        }

        .clue-img {
            font-size: 4rem;
            line-height: 1;
        }
    </style>
</head>

<body>
    <div class="game-card">
        <h2>Mini Game: JomBaca & Mengira 🎯</h2>

        <!-- Pilihan Mod Game -->
        <div style="margin-bottom: 5px; font-weight: bold; color: #555;">1. Pilih Mod Permainan:</div>
        <div class="selector-box">
            <button class="mode-btn active" id="btn-m-mengeja" onclick="selectMode('mengeja')">🔤 Mengeja</button>
            <button class="mode-btn" id="btn-m-mengira" onclick="selectMode('mengira')">🔢 Mengira</button>
        </div>

        <!-- Pilihan Tahap Kesukaran -->
        <div style="margin-bottom: 5px; font-weight: bold; color: #555;">2. Pilih Tahap Kesukaran:</div>
        <div class="selector-box">
            <button class="diff-btn active" data-diff="mudah" onclick="selectDiff('mudah')">🌱 Mudah (10 Mata)</button>
            <button class="diff-btn" data-diff="normal" onclick="selectDiff('normal')">⭐ Normal (20 Mata)</button>
            <button class="diff-btn" data-diff="susah" onclick="selectDiff('susah')">🔥 Susah (35 Mata)</button>
        </div>

        <div class="score-board">
            <span>⭐ Skor: <span id="current-score">0</span></span>
            <span>✨ XP: <span id="user-xp">{{ user.xp }}</span></span>
            <span>🪙 Coin: <span id="user-coins">{{ user.coins }}</span></span>
        </div>

        <button onclick="startGameSession()" class="btn-primary"
            style="margin-bottom: 15px; width: 100%; background: #4CAF50;">Mula Pusingan Baru 🚀</button>

        <p id="instruction" style="font-size: 1.2rem; font-weight: bold; min-height: 30px;">Pilih mod & tahap di atas,
            kemudian tekan Mula!</p>

        <div class="question-box" id="question">...</div>

        <div class="options-grid" id="options"></div>

        <div id="feedback" style="margin-top: 20px; font-size: 1.3rem; font-weight: bold; height: 30px;"></div>

        <div style="margin-top: 25px;">
            <a href="{{ url_for('game.dashboard') }}" style="color: #666; text-decoration: none; font-weight: bold;">⬅
                Kembali ke Dashboard</a>
        </div>
    </div>

    <script>
        // GENERATOR BANK SOALAN MENGEJA (150 SOALAN SETIAP TAHAP)
        function generateMengejaBank() {
            const rawMudah = [
                ['ULAR', 'U', 'LAR', '🐍'], ['BOLA', 'BO', 'LA', '⚽'], ['BATU', 'BA', 'TU', '🪨'], ['BUKU', 'BU', 'KU', '📖'],
                ['NASI', 'NA', 'SI', '🍚'], ['KUDA', 'KU', 'DA', '🐎'], ['RUSA', 'RU', 'SA', '🦌'], ['ITIK', 'I', 'TIK', '🦆'],
                ['IKAN', 'I', 'KAN', '🐟'], ['EPAL', 'E', 'PAL', '🍎'], ['ROTI', 'RO', 'TI', '🍞'], ['SUDU', 'SU', 'DU', '🥄'],
                ['LAPI', 'LA', 'PI', '🧹'], ['PENA', 'PE', 'NA', '🖊️'], ['MEJA', 'ME', 'JA', '🪑'], ['TOPI', 'TO', 'PI', '🧢'],
                ['LARI', 'LA', 'RI', '🏃'], ['TALI', 'TA', 'LI', '🪢'], ['GULA', 'GU', 'LA', '🍬'], ['SUSU', 'SU', 'SU', '🥛'],
                ['MATA', 'MA', 'TA', '👁️'], ['GIGI', 'GI', 'GI', '🦷'], ['JARI', 'JA', 'RI', '🖐️'], ['DAGU', 'DA', 'GU', '🗣️'],
                ['KAKI', 'KA', 'KI', '🦶'], ['BAJU', 'BA', 'JU', '👕'], ['FOTO', 'FO', 'TO', '📷'], ['KERA', 'KE', 'RA', '🐒'],
                ['BUMI', 'BU', 'MI', '🌍'], ['RODA', 'RO', 'DA', '🛞'], ['PASU', 'PA', 'SU', '🪴'], ['PAKU', 'PA', 'KU', '📌'],
                ['LABU', 'LA', 'BU', '🎃'], ['SOTO', 'SO', 'TO', '🍲'], ['SUKA', 'SU', 'KA', '❤️'], ['DADA', 'DA', 'DA', '🫁'],
                ['LIMA', 'LI', 'MA', '5️⃣'], ['DUA', 'DU', 'A', '2️⃣'], ['SATU', 'SA', 'TU', '1️⃣'], ['TIGA', 'TI', 'GA', '3️⃣']
            ];

            const rawNormal = [
                ['KUCING', 'KU', 'CING', '🐱'], ['SEKOLAH', 'SEKO', 'LAH', '🏫'], ['BURUNG', 'BU', 'RUNG', '🐦'], ['MERAH', 'ME', 'RAH', '🔴'],
                ['PISANG', 'PI', 'SANG', '🍌'], ['KERETA', 'KE', 'RETA', '🚗'], ['KERTAS', 'KER', 'TAS', '📄'], ['PANDAI', 'PAN', 'DAI', '🎓'],
                ['DINDING', 'DIN', 'DING', '🧱'], ['RUMAH', 'RU', 'MAH', '🏠'], ['POKOK', 'PO', 'KOK', '🌳'], ['PADANG', 'PA', 'DANG', '🏞️'],
                ['TAMAN', 'TA', 'MAN', '🌷'], ['KEDAI', 'KE', 'DAI', '🏪'], ['KERUSI', 'KE', 'RUSI', '🪑'], ['LEMBAR', 'LEM', 'BAR', '📋'],
                ['LEMBUT', 'LEM', 'BUT', '🧸'], ['PINTU', 'PIN', 'TU', '🚪'], ['TINGGI', 'TING', 'GI', '📏'], ['RENDAH', 'REN', 'DAH', '📉'],
                ['PANAS', 'PA', 'NAS', '🔥'], ['SEJUK', 'SE', 'JUK', '🧊'], ['MALAM', 'MA', 'LAM', '🌙'], ['SIANG', 'SI', 'ANG', '☀️'],
                ['BINTANG', 'BIN', 'TANG', '⭐'], ['AWAN', 'A', 'WAN', '☁️'], ['HUJAN', 'HU', 'JAN', '🌧️'], ['KULIT', 'KU', 'LIT', '🖐️'],
                ['RAMBUT', 'RAM', 'BUT', '💇'], ['TANGAN', 'TANG', 'AN', '✋'], ['TELINGA', 'TE', 'LINGA', '👂'], ['KAPAL', 'KA', 'PAL', '🚢']
            ];

            const rawSusah = [
                ['FOTOSINTESIS', 'Fotosintesis', 'Potosintesis', 'Fotosintisis', 'Fotosentisis'],
                ['AMFIBIA', 'Amfibia', 'Amfebea', 'Amfibiya', 'Ampibia'],
                ['PELANGI', 'Pelangi', 'Pelanggi', 'Polangi', 'Pelangie'],
                ['KHUSUS', 'Khusus', 'Kosos', 'Khusos', 'Khasas'],
                ['KEBANGSAAN', 'Kebangsaan', 'Kembangsaan', 'Kebangsan', 'Kebangsaan'],
                ['CEKAP', 'Cekap', 'Cakap', 'Cekat', 'Cekab'],
                ['EKOSISTEM', 'Ekosistem', 'Ekosestem', 'Ecosystem', 'Ekesistem'],
                ['BIODIVERSITI', 'Biodiversiti', 'Biodiversity', 'Biodiversitiy', 'Biodiverseti'],
                ['GRAVITI', 'Graviti', 'Grebiti', 'Grafiti', 'Graveti'],
                ['ATMOSFERA', 'Atmosfera', 'Atmosferah', 'Atmosfira', 'Atmasfera'],
                ['MOLEKUL', 'Molekul', 'Molekol', 'Molecul', 'Melekul'],
                ['REAKSI', 'Reaksi', 'Reksi', 'Riyaksi', 'Reaksea'],
                ['ORGANISME', 'Organisme', 'Organisma', 'Organism', 'Orgenesme'],
                ['PENYAPATAN', 'Penyelidikan', 'Penyelidekan', 'Penyelidikan', 'Penyelidokan'],
                ['PERHUBUNGAN', 'Perhubungan', 'Perhubongaan', 'Perehubungan', 'Perhubungn']
            ];

            let mudahList = [];
            for (let i = 0; i < 150; i++) {
                let item = rawMudah[i % rawMudah.length];
                let isFillBlank = (i % 2 === 0);
                if (isFillBlank) {
                    let missingChar = item[0][item[0].length - 2] || 'A';
                    mudahList.push({
                        id: `e_m_${i}`,
                        prompt: "Lengkapkan huruf tempat kosong:",
                        clue: "",
                        display_html: `<span class='suku-biru'>${item[1]}</span><span class='suku-merah'>${item[2].replace(/[AEIOUaeiou]/, '_')}</span>`,
                        choices: shuffle([missingChar, 'E', 'I', 'O']),
                        answer: missingChar
                    });
                } else {
                    mudahList.push({
                        id: `e_m_${i}`,
                        prompt: "Pilih gambar yang sepadan bagi ejaan berikut:",
                        clue: "",
                        display_html: `<span class='suku-biru'>${item[1]}</span><span class='suku-merah'>${item[2]}</span>`,
                        choices: shuffle([item[3], '🐱', '🐶', '🚗']),
                        answer: item[3]
                    });
                }
            }

            let normalList = [];
            for (let i = 0; i < 150; i++) {
                let item = rawNormal[i % rawNormal.length];
                let isFillBlank = (i % 2 === 0);
                if (isFillBlank) {
                    let missingChar = item[0][item[0].length - 2] || 'A';
                    normalList.push({
                        id: `e_n_${i}`,
                        prompt: "Lengkapkan ejaan berikut:",
                        clue: "",
                        display_html: `<span class='suku-biru'>${item[1]}</span><span class='suku-merah'>${item[2].replace(/[AEIOUaeiou]/, '_')}</span>`,
                        choices: shuffle([missingChar, 'U', 'I', 'O']),
                        answer: missingChar
                    });
                } else {
                    normalList.push({
                        id: `e_n_${i}`,
                        prompt: "Pilih gambar yang sepadan bagi perkataan:",
                        clue: "",
                        display_html: `<span class='suku-biru'>${item[1]}</span><span class='suku-merah'>${item[2]}</span>`,
                        choices: shuffle([item[3], '🏫', '🏠', '⭐']),
                        answer: item[3]
                    });
                }
            }

            let susahList = [];
            for (let i = 0; i < 150; i++) {
                let item = rawSusah[i % rawSusah.length];
                susahList.push({
                    id: `e_s_${i}`,
                    prompt: `Pilih ejaan khusus yang betul bagi ${item[0]}:`,
                    clue: "",
                    display_html: `${item[0]}`,
                    choices: shuffle([item[1], item[2], item[3], item[4]]),
                    answer: item[1]
                });
            }

            return { mudah: mudahList, normal: normalList, susah: susahList };
        }

        const bankMengeja = generateMengejaBank();

        // GENERATOR BANK SOALAN MENGIRA (150 SOALAN SETIAP TAHAP)
        function generateMathQuestions(diff) {
            let list = [];
            if (diff === 'mudah') {
                for (let i = 1; i <= 150; i++) {
                    let a = Math.floor(Math.random() * 9) + 1;
                    let b = Math.floor(Math.random() * 9) + 1;
                    let isAdd = Math.random() > 0.5;
                    if (!isAdd && a < b) { let tmp = a; a = b; b = tmp; }
                    let ans = isAdd ? (a + b) : (a - b);
                    let op = isAdd ? "+" : "-";
                    let wrong1 = ans + 1, wrong2 = Math.max(0, ans - 1), wrong3 = ans + 2;
                    list.push({
                        id: `m_m_${i}`,
                        prompt: "Selesaikan operasi tambah/tolak mudah (1-10):",
                        clue: "",
                        display_html: `${a} ${op} ${b} = ?`,
                        choices: shuffle([ans.toString(), wrong1.toString(), wrong2.toString(), wrong3.toString()]),
                        answer: ans.toString()
                    });
                }
            } else if (diff === 'normal') {
                const ops = ['+', '-', '*', '/'];
                for (let i = 1; i <= 150; i++) {
                    let op = ops[Math.floor(Math.random() * ops.length)];
                    let a = Math.floor(Math.random() * 9) + 1;
                    let b = Math.floor(Math.random() * 9) + 1;
                    let ans = 0;
                    if (op === '+') ans = a + b;
                    else if (op === '-') { if (a < b) { let tmp = a; a = b; b = tmp; } ans = a - b; }
                    else if (op === '*') ans = a * b;
                    else if (op === '/') { ans = a; a = a * b; }

                    let wrong1 = ans + 2, wrong2 = Math.max(0, ans - 1), wrong3 = ans + 3;
                    list.push({
                        id: `m_n_${i}`,
                        prompt: "Selesaikan operasi matematik (1-10):",
                        clue: "",
                        display_html: `${a} ${op === '*' ? '×' : (op === '/' ? '÷' : op)} ${b} = ?`,
                        choices: shuffle([ans.toString(), wrong1.toString(), wrong2.toString(), wrong3.toString()]),
                        answer: ans.toString()
                    });
                }
            } else if (diff === 'susah') {
                const ops = ['+', '-', '*', '/'];
                for (let i = 1; i <= 150; i++) {
                    let op = ops[Math.floor(Math.random() * ops.length)];
                    let a = Math.floor(Math.random() * 80) + 10;
                    let b = Math.floor(Math.random() * 80) + 10;
                    let ans = 0;
                    if (op === '+') ans = a + b;
                    else if (op === '-') { if (a < b) { let tmp = a; a = b; b = tmp; } ans = a - b; }
                    else if (op === '*') { a = Math.floor(Math.random() * 12) + 2; b = Math.floor(Math.random() * 12) + 2; ans = a * b; }
                    else if (op === '/') { b = Math.floor(Math.random() * 9) + 2; ans = Math.floor(Math.random() * 10) + 2; a = ans * b; }

                    let wrong1 = ans + 5, wrong2 = Math.max(0, ans - 3), wrong3 = ans + 10;
                    list.push({
                        id: `m_s_${i}`,
                        prompt: "Selesaikan soalan matematik cabaran susah (1-100):",
                        clue: "",
                        display_html: `${a} ${op === '*' ? '×' : (op === '/' ? '÷' : op)} ${b} = ?`,
                        choices: shuffle([ans.toString(), wrong1.toString(), wrong2.toString(), wrong3.toString()]),
                        answer: ans.toString()
                    });
                }
            }
            return list;
        }

        let currentMode = 'mengeja';
        let currentDiff = 'mudah';
        let currentIdx = 0;
        let sessionScore = 0;
        let activeQuestions = [];
        let seenQuestionIds = [];

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function selectMode(m) {
            currentMode = m;
            document.getElementById('btn-m-mengeja').classList.toggle('active', m === 'mengeja');
            document.getElementById('btn-m-mengira').classList.toggle('active', m === 'mengira');
        }

        function selectDiff(d) {
            currentDiff = d;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.diff === d);
            });
        }

        // Ambil senarai ID soalan yang pernah dijawab dlm masa 7 hari daripada backend
        function fetchSeenQuestionsAndStart() {
            fetch('/get-seen-questions')
                .then(res => res.json())
                .then(data => {
                    seenQuestionIds = data.seen_ids || [];
                    prepareQuestions();
                })
                .catch(err => {
                    console.error("Ralat ambil soalan 7 hari:", err);
                    prepareQuestions();
                });
        }

        function prepareQuestions() {
            let pool = [];
            if (currentMode === 'mengeja') {
                pool = [...bankMengeja[currentDiff]];
            } else {
                pool = generateMathQuestions(currentDiff);
            }

            // Tapis soalan supaya elak soalan yang dijawab dlm masa 7 hari
            let freshPool = pool.filter(q => !seenQuestionIds.includes(q.id));
            if (freshPool.length < 5) {
                freshPool = pool;
            }

            activeQuestions = shuffle(freshPool).slice(0, 5);
            currentIdx = 0;
            sessionScore = 0;
            document.getElementById('current-score').innerText = sessionScore;
            loadQuestion();
        }

        function startGameSession() {
            fetchSeenQuestionsAndStart();
        }

        function loadQuestion() {
            if (currentIdx >= activeQuestions.length) {
                document.getElementById('question').innerText = "🎉 TAHNIAH!";
                document.getElementById('instruction').innerText = `Tamat Pusingan ${currentMode.toUpperCase()} (${currentDiff.toUpperCase()})! Skor: ${sessionScore}`;
                document.getElementById('options').innerHTML = `<button class="option-btn" onclick="startGameSession()" style="grid-column: span 2; background: var(--primary); color: white;">Simpan Skor & Main Lagi 💾</button>`;
                document.getElementById('feedback').innerText = "";

                // Rekod soalan yang telah dijawab ke backend
                const answeredIds = activeQuestions.map(q => q.id);
                recordQuestionsToBackend(answeredIds);
                saveScoreToBackend(sessionScore);
                return;
            }

            const q = activeQuestions[currentIdx];
            document.getElementById('instruction').innerText = q.prompt;

            let qContent = `<div>${q.display_html}</div>`;
            document.getElementById('question').innerHTML = qContent;

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';

            const shuffledChoices = shuffle([...q.choices]);
            shuffledChoices.forEach((choice) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(choice, q.answer);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(selectedChoice, correctChoice) {
            const feedback = document.getElementById('feedback');
            const pts = currentDiff === 'mudah' ? 10 : (currentDiff === 'normal' ? 20 : 35);

            if (selectedChoice === correctChoice) {
                sessionScore += pts;
                document.getElementById('current-score').innerText = sessionScore;
                feedback.style.color = "#2E7D32";
                feedback.innerText = `Syabas! Jawapan Betul! (+${pts} Mata) 🥳`;
            } else {
                feedback.style.color = "#C62828";
                feedback.innerText = "Alamak! Cuba lagi ya! 😅";
            }

            setTimeout(() => {
                feedback.innerText = "";
                currentIdx++;
                loadQuestion();
            }, 1000);
        }

        function recordQuestionsToBackend(qIds) {
            fetch('/record-questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question_ids: qIds })
            }).catch(err => console.error("Ralat rekod soalan:", err));
        }

        function saveScoreToBackend(pts) {
            fetch('/save-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ score: pts })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('user-xp').innerText = data.new_xp;
                        document.getElementById('user-coins').innerText = data.new_coins;
                    }
                })
                .catch(err => console.error("Ralat simpan skor:", err));
        }

        // Mula secara automatik bila muat turun halaman
        startGameSession();
    </script>
</body>

</html>
